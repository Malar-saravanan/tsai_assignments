<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐾 WildSnap - Animal Discovery & File Hub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .content {
            padding: 40px;
        }

        .boxes-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            margin-bottom: 40px;
        }

        .box {
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            padding: 30px;
            transition: all 0.3s ease;
        }

        .box:hover {
            border-color: #4f46e5;
            box-shadow: 0 10px 25px rgba(79, 70, 229, 0.1);
        }

        .box h2 {
            color: #4f46e5;
            margin-bottom: 20px;
            font-size: 1.5rem;
            text-align: center;
        }

        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
            background: white;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 3px solid transparent;
            text-align: center;
            position: relative;
        }

        .checkbox-item:hover {
            background: #f0f9ff;
            border-color: #0ea5e9;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(14, 165, 233, 0.15);
        }

        .checkbox-item.selected {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: white;
            border-color: #4f46e5;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(79, 70, 229, 0.3);
        }

        .checkbox-item input[type="radio"] {
            position: absolute;
            opacity: 0;
            width: 0;
            height: 0;
        }

        .checkbox-item label {
            font-size: 1.3rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        .animal-emoji {
            font-size: 3rem;
            margin-bottom: 5px;
        }

        .upload-area {
            border: 3px dashed #d1d5db;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            background: white;
        }

        .upload-area:hover {
            border-color: #4f46e5;
            background-color: #f8fafc;
        }

        .upload-area.dragover {
            border-color: #4f46e5;
            background-color: #ede9fe;
        }

        .upload-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .upload-text {
            font-size: 1.1rem;
            color: #6b7280;
            margin-bottom: 10px;
        }

        .file-input {
            display: none;
        }

        .results-container {
            margin-top: 40px;
        }

        .result-box {
            background: #f0f9ff;
            border: 2px solid #0ea5e9;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            display: none;
        }

        .result-box.show {
            display: block;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animal-result {
            text-align: center;
        }

        .animal-display {
            text-align: center;
            padding: 20px;
        }
        
        .animal-image-large {
            max-width: 400px;
            max-height: 300px;
            width: 100%;
            height: auto;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            margin-bottom: 20px;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        
        .animal-image-large:hover {
            transform: scale(1.02);
        }
        
        .animal-name {
            font-size: 2rem;
            color: #4f46e5;
            margin-bottom: 15px;
        }
        
        .animal-description {
            font-size: 1.2rem;
            color: #374151;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        
        .animal-facts {
            background: white;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
            text-align: left;
        }
        
        .animal-facts h4 {
            color: #4f46e5;
            margin-bottom: 15px;
            text-align: center;
        }
        
        .animal-facts ul {
            list-style: none;
            padding: 0;
        }
        
        .animal-facts li {
            padding: 8px 0;
            border-bottom: 1px solid #f3f4f6;
            position: relative;
            padding-left: 25px;
        }
        
        .animal-facts li:before {
            content: "✨";
            position: absolute;
            left: 0;
        }
        
        .animal-facts li:last-child {
            border-bottom: none;
        }

        .file-info {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-top: 15px;
        }

        .file-info-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e5e7eb;
        }

        .file-info-item:last-child {
            border-bottom: none;
        }

        .file-info-label {
            font-weight: 600;
            color: #374151;
        }

        .file-info-value {
            color: #6b7280;
        }

        .success-message {
            color: #059669;
            font-weight: 600;
            text-align: center;
            margin-bottom: 15px;
        }

        .error-message {
            color: #dc2626;
            font-weight: 600;
            text-align: center;
            margin-bottom: 15px;
        }

        .loading {
            text-align: center;
            color: #4f46e5;
            font-weight: 500;
            display: none;
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #4f46e5;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .boxes-container {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🐾 WildSnap</h1>
            <p>Discover amazing animals and manage your files with style!</p>
        </div>

        <div class="content">
            <div class="boxes-container">
                <!-- Box 1: Animal Selection -->
                <div class="box">
                    <h2>🐾 Choose an Animal</h2>
                    <div class="checkbox-group">
                        <div class="checkbox-item" data-animal="cat">
                            <input type="radio" id="cat" name="animal" value="cat">
                            <label for="cat">
                                <span class="animal-emoji">🐱</span>
                                <span>Cat</span>
                            </label>
                        </div>
                        <div class="checkbox-item" data-animal="dog">
                            <input type="radio" id="dog" name="animal" value="dog">
                            <label for="dog">
                                <span class="animal-emoji">🐶</span>
                                <span>Dog</span>
                            </label>
                        </div>
                        <div class="checkbox-item" data-animal="elephant">
                            <input type="radio" id="elephant" name="animal" value="elephant">
                            <label for="elephant">
                                <span class="animal-emoji">🐘</span>
                                <span>Elephant</span>
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Box 2: File Upload -->
                <div class="box">
                    <h2>📁 Upload a File</h2>
                    <div class="upload-area" id="uploadArea">
                        <div class="upload-icon">📤</div>
                        <div class="upload-text">Click to select a file or drag & drop here</div>
                        <div style="font-size: 0.9rem; color: #9ca3af;">
                            Supported: Images, Documents, Audio, Video, Archives
                        </div>
                        <input type="file" id="fileInput" class="file-input">
                    </div>
                    <div class="loading" id="uploadLoading">
                        <div class="spinner"></div>
                        Uploading file...
                    </div>
                </div>
            </div>

            <!-- Results Container -->
            <div class="results-container" id="resultsContainer">
                <!-- Animal Result -->
                <div class="result-box" id="animalResult">
                    <div class="animal-result">
                        <div class="success-message" id="animalMessage"></div>
                        <div class="animal-display">
                            <img class="animal-image-large" id="animalImageLarge" alt="Selected Animal">
                            <div class="animal-name" id="animalName"></div>
                            <div class="animal-description" id="animalDescription"></div>
                            <div class="animal-facts" id="animalFacts">
                                <h4>🌟 Fun Facts</h4>
                                <ul id="animalFactsList"></ul>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- File Upload Result -->
                <div class="result-box" id="fileResult">
                    <div class="success-message" id="fileMessage"></div>
                    <div class="file-info" id="fileInfo"></div>
                </div>

                <!-- Error Messages -->
                <div class="result-box" id="errorResult">
                    <div class="error-message" id="errorMessage"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Animal selection functionality
        const animalCheckboxes = document.querySelectorAll('input[name="animal"]');
        const animalItems = document.querySelectorAll('.checkbox-item');
        const animalResult = document.getElementById('animalResult');
        const animalMessage = document.getElementById('animalMessage');

        // Add click handlers to the entire animal boxes
        animalItems.forEach(item => {
            item.addEventListener('click', function() {
                const radioButton = this.querySelector('input[type="radio"]');
                const animalValue = this.getAttribute('data-animal');
                
                // Remove selected class from all items
                animalItems.forEach(i => i.classList.remove('selected'));
                
                // Add selected class to clicked item
                this.classList.add('selected');
                
                // Check the radio button
                radioButton.checked = true;
                
                // Fetch animal information
                fetchAnimalImage(animalValue);
            });
        });

        // Also handle direct radio button changes (for keyboard navigation)
        animalCheckboxes.forEach(radioButton => {
            radioButton.addEventListener('change', function() {
                if (this.checked) {
                    // Remove selected class from all items
                    animalItems.forEach(i => i.classList.remove('selected'));
                    
                    // Add selected class to parent item
                    this.closest('.checkbox-item').classList.add('selected');
                    
                    fetchAnimalImage(this.value);
                }
            });
        });

        async function fetchAnimalImage(animal) {
            try {
                const response = await fetch(`/api/animal/${animal}`);
                const data = await response.json();

                if (response.ok) {
                    document.getElementById('animalImageLarge').src = data.image_url;
                    document.getElementById('animalImageLarge').alt = data.name;
                    document.getElementById('animalName').textContent = data.name;
                    document.getElementById('animalDescription').textContent = data.description;
                    animalMessage.textContent = data.message;
                    
                    // Populate facts list
                    const factsList = document.getElementById('animalFactsList');
                    factsList.innerHTML = '';
                    data.facts.forEach(fact => {
                        const li = document.createElement('li');
                        li.textContent = fact;
                        factsList.appendChild(li);
                    });
                    
                    showResult('animalResult');
                } else {
                    showError(data.error);
                }
            } catch (error) {
                showError('Failed to fetch animal information');
            }
        }

        // File upload functionality
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const uploadLoading = document.getElementById('uploadLoading');
        const fileResult = document.getElementById('fileResult');
        const fileMessage = document.getElementById('fileMessage');
        const fileInfo = document.getElementById('fileInfo');

        uploadArea.addEventListener('click', () => fileInput.click());

        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                uploadFile(files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                uploadFile(e.target.files[0]);
            }
        });

        async function uploadFile(file) {
            const formData = new FormData();
            formData.append('file', file);

            uploadLoading.style.display = 'block';
            hideResult('fileResult');
            hideResult('errorResult');

            try {
                const response = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                
                uploadLoading.style.display = 'none';

                if (response.ok) {
                    fileMessage.textContent = data.message;
                    fileInfo.innerHTML = `
                        <div class="file-info-item">
                            <span class="file-info-label">📄 File Name:</span>
                            <span class="file-info-value">${data.filename}</span>
                        </div>
                        <div class="file-info-item">
                            <span class="file-info-label">📏 File Size:</span>
                            <span class="file-info-value">${data.file_size} (${data.file_size_bytes.toLocaleString()} bytes)</span>
                        </div>
                        <div class="file-info-item">
                            <span class="file-info-label">🏷️ File Type:</span>
                            <span class="file-info-value">${data.file_type}</span>
                        </div>
                    `;
                    showResult('fileResult');
                } else {
                    showError(data.error);
                }
            } catch (error) {
                uploadLoading.style.display = 'none';
                showError('Failed to upload file: ' + error.message);
            }
        }

        // Utility functions
        function showResult(resultId) {
            hideAllResults();
            document.getElementById(resultId).classList.add('show');
        }

        function hideResult(resultId) {
            document.getElementById(resultId).classList.remove('show');
        }

        function hideAllResults() {
            document.querySelectorAll('.result-box').forEach(box => {
                box.classList.remove('show');
            });
        }

        function showError(message) {
            document.getElementById('errorMessage').textContent = message;
            showResult('errorResult');
        }
    </script>
</body>
</html>
