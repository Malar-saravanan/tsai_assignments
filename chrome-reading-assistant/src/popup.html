<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reading Progress Saver</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 350px;
      min-height: 400px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .header {
      padding: 20px;
      text-align: center;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
    }

    .header h1 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .header p {
      font-size: 12px;
      opacity: 0.8;
    }

    .current-progress {
      padding: 15px 20px;
      background: rgba(255, 255, 255, 0.1);
      margin: 10px 20px;
      border-radius: 10px;
      backdrop-filter: blur(10px);
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      overflow: hidden;
      margin: 10px 0;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #4CAF50, #45a049);
      border-radius: 4px;
      transition: width 0.3s ease;
    }

    .progress-text {
      font-size: 12px;
      opacity: 0.9;
    }

    .actions {
      padding: 0 20px;
      margin-bottom: 15px;
    }

    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-bottom: 8px;
    }

    .btn-primary {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .btn-primary:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: translateY(-1px);
    }

    .btn-danger {
      background: rgba(244, 67, 54, 0.8);
      color: white;
    }

    .btn-danger:hover {
      background: rgba(244, 67, 54, 1);
      transform: translateY(-1px);
    }

    .saved-pages {
      padding: 0 20px;
      margin-bottom: 20px;
    }

    .saved-pages h3 {
      font-size: 14px;
      margin-bottom: 10px;
      opacity: 0.9;
    }

    .page-list {
      max-height: 200px;
      overflow-y: auto;
    }

    .page-item {
      background: rgba(255, 255, 255, 0.1);
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .page-item:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateX(2px);
    }

    .page-title {
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .page-url {
      font-size: 10px;
      opacity: 0.7;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .page-time {
      font-size: 10px;
      opacity: 0.6;
      margin-top: 5px;
    }

    .empty-state {
      text-align: center;
      padding: 20px;
      opacity: 0.7;
    }

    .empty-state p {
      font-size: 12px;
      margin-bottom: 10px;
    }

    .loading {
      text-align: center;
      padding: 20px;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top: 2px solid white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 10px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .status {
      padding: 10px 20px;
      font-size: 12px;
      text-align: center;
      opacity: 0.8;
    }

    .toggle-status {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      font-size: 12px;
    }

    .status-indicator {
      font-size: 16px;
      font-weight: bold;
    }

    .status-enabled {
      color: #4CAF50;
    }

    .status-disabled {
      color: #f44336;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>📖 Reading Progress Saver</h1>
    <p>Never lose your place again</p>
  </div>

  <div class="current-progress">
    <div class="progress-text">Current Page Progress</div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="progress-text" id="progressText">Loading...</div>
    <div class="toggle-status" id="toggleStatus">
      <span class="status-indicator" id="statusIndicator">●</span>
      <span id="statusText">Checking...</span>
    </div>
  </div>

  <div class="actions">
    <button class="btn btn-primary" id="toggleTracking">Enable/Disable Tracking</button>
    <button class="btn btn-primary" id="clearCurrent">Clear Current Progress</button>
    <button class="btn btn-danger" id="clearAll">Clear All Progress</button>
  </div>

  <div class="saved-pages">
    <h3>Recently Saved Pages</h3>
    <div class="page-list" id="pageList">
      <div class="loading">
        <div class="spinner"></div>
        <div>Loading saved pages...</div>
      </div>
    </div>
  </div>

  <div class="status" id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
